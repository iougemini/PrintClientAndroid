name: 打包 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 图标自检：确认仓库里的图标确实是 logo.png 生成的那一套。
      # 若 res/mipmap-* 被 Android Studio 的默认图标（绿底网格+白色机器人）覆盖，
      # 这一步会直接红掉，而不是悄悄打出一个图标错误的包。
      - name: 校验图标资源
        run: |
          set -eo pipefail
          RES=app/src/main/res
          XML="$RES/mipmap-anydpi-v26/ic_launcher.xml"

          echo "--- 模板残留检查 ---"
          stray=$(find "$RES" -name '*.webp' -o -name 'ic_launcher_background.xml' | sort || true)
          if [ -n "$stray" ]; then
            echo "::warning::发现 Android Studio 模板文件，可能覆盖我们的图标："
            echo "$stray"
          fi

          echo "--- 自适应图标 XML 内容检查 ---"
          if [ ! -f "$XML" ]; then
            echo "::error::缺少 $XML（自适应图标被删了）"; exit 1
          fi
          # 注意：我们自己也有 @color/ic_launcher_background（纯白底），
          # 所以只把「@drawable/ic_launcher_background」当成模板特征。
          if grep -q '@drawable/ic_launcher_background' "$XML" || ! grep -q '@mipmap/ic_launcher_foreground' "$XML"; then
            echo "::error::$XML 指向的是安卓默认模板（@drawable/ic_launcher_background + 矢量机器人），不是我们的 logo。"
            echo "处理：把本地 PrintClientAndroid/app/src/main/res 整个目录重新上传覆盖后重跑。"
            exit 1
          fi
          echo "✅ 自适应图标指向 @mipmap/ic_launcher_foreground"

          echo "--- PNG 指纹比对 ---"
          if ! md5sum -c --quiet tools/icon_checksums.txt; then
            echo ""
            echo "::error::上面这些 PNG 与工程里由 public/logo.png 生成的那一套不一致（缺失或被替换）。"
            echo "常见原因：仓库里的 res/mipmap-* 被 Android Studio 新建工程时生成的默认图标覆盖了。"
            echo "处理：把本地 PrintClientAndroid/app/src/main/res 整个目录重新上传覆盖，然后重跑本工作流。"
            exit 1
          fi
          echo "✅ 16 个图标 PNG 全部匹配"

      # PNG 结构自检（chunk CRC），脚本在 tools/check_png.py。
      # 曾经踩过的坑：生成器把每个 chunk 的 CRC32 写错，文件大小/名字/MD5 全对，
      # 但 Android 的 libpng 解码失败 → 启动器退回系统默认图标（绿底机器人）。
      # 光比对 MD5 抓不到这种错，必须验 chunk CRC。
      - name: 校验 PNG 结构（chunk CRC）
        run: python3 tools/check_png.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 云主机自带 Android SDK，直接用它的 sdkmanager 补齐 compileSdk 需要的组件。
      # 注意：不要再套 android-actions/setup-android@v3 —— 它默认安装的 "tools" 包
      # 已从 SDK 仓库移除，会以 "Failed to find package 'tools'" 直接失败。
      - name: 安装 Android SDK 组件
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK root: $SDK"

          # 接受许可证。sdkmanager 读完输入就退出，yes 会因 SIGPIPE 返回 141，
          # 配合 pipefail 会把整步判失败，所以这一段临时关掉 pipefail。
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          # 安装平台：成功只回显末几行，失败打印日志尾部便于排查
          if ! "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /tmp/sdk-install.log 2>&1; then
            echo "sdkmanager 安装失败："
            tail -40 /tmp/sdk-install.log
            exit 1
          fi
          tail -3 /tmp/sdk-install.log

      # 显式指定 SDK 路径，省得 AGP 在云主机上找不到
      - name: 写入 local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties

      # 工程里只有 gradle-wrapper.properties、没有 wrapper jar，所以用 setup-gradle 装指定版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 查看产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PrintClient-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
