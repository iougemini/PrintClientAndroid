name: 打包 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 云主机自带 Android SDK，但平台版本不一定齐，显式补齐 compileSdk 需要的组件
      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 组件
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      # 工程里只有 gradle-wrapper.properties、没有 wrapper jar，所以用 setup-gradle 装指定版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 查看产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PrintClient-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
