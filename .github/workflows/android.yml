name: 打包 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 云主机自带 Android SDK，直接用它的 sdkmanager 补齐 compileSdk 需要的组件。
      # 注意：不要再套 android-actions/setup-android@v3 —— 它默认安装的 "tools" 包
      # 已从 SDK 仓库移除，会以 "Failed to find package 'tools'" 直接失败。
      - name: 安装 Android SDK 组件
        run: |
          set -eo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK root: $SDK"

          # 接受许可证。sdkmanager 读完输入就退出，yes 会因 SIGPIPE 返回 141，
          # 配合 pipefail 会把整步判失败，所以这一段临时关掉 pipefail。
          set +o pipefail
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          # 安装平台：成功只回显末几行，失败打印日志尾部便于排查
          if ! "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /tmp/sdk-install.log 2>&1; then
            echo "sdkmanager 安装失败："
            tail -40 /tmp/sdk-install.log
            exit 1
          fi
          tail -3 /tmp/sdk-install.log

      # 显式指定 SDK 路径，省得 AGP 在云主机上找不到
      - name: 写入 local.properties
        run: echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > local.properties

      # 工程里只有 gradle-wrapper.properties、没有 wrapper jar，所以用 setup-gradle 装指定版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 查看产物
        run: ls -lh app/build/outputs/apk/debug/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PrintClient-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
